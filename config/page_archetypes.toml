  "D_ItemsStatic",
  "D_Itemable",
  "D_Talents",
  "D_Durable",
  "D_FirearmData",
  "D_ValidAmmoTypes",
  "D_WorkshopItems",
]
components = [
  "description_section",
  "obtaining_section",
  "ammo_section",
  "repair_section",
]
