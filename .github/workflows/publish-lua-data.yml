name: Publish Lua Data

on:
  push:
    branches:
      - main
    paths:
      - "generated/*.lua"
  workflow_dispatch:

permissions:
  contents: read

# Edit these data page titles to point at sandbox pages while testing.
env:
  WIKI_API_URL: "https://icarus.wiki.gg/api.php"
  TALENT_DATA_PAGE: "Module:TalentTree/TalentData"
  TECH_DATA_PAGE: "Module:TechTree/TechData"
  ANIMAL_TALENT_DATA_PAGE: "Module:AnimalTalentTree/AnimalTalentData"
  MISSION_DATA_PAGE: "Module:MissionTree/MissionData"
  WORKSHOP_DATA_PAGE: "Module:WorkshopTree/WorkshopData"

concurrency:
  group: publish-lua-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout TreeUI
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish Lua data pages
        shell: bash
        env:
          WIKIGG_USERNAME: ${{ secrets.WIKIGG_USERNAME }}
          WIKIGG_APP_PASSWORD: ${{ secrets.WIKIGG_APP_PASSWORD }}
        run: |
          python scripts/publish_wiki_modules.py \
            --api-url "$WIKI_API_URL" \
            --summary "Automated update from https://github.com/IcarusWiki/TreeUI ${GITHUB_SHA}" \
            --map "generated/TalentData.lua=${TALENT_DATA_PAGE}" \
            --map "generated/TechData.lua=${TECH_DATA_PAGE}" \
            --map "generated/AnimalTalentData.lua=${ANIMAL_TALENT_DATA_PAGE}" \
            --map "generated/MissionData.lua=${MISSION_DATA_PAGE}" \
            --map "generated/WorkshopData.lua=${WORKSHOP_DATA_PAGE}"